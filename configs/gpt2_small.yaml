model:
  n_layer: 12
  n_embd: 768
  n_head: 12
  block_size: 1024
  vocab_size: 50304
  dropout: 0.0
  bias: true

train:
  out_dir: checkpoints/gpt2_small
  batch_size: 8
  grad_accum_steps: 8
  max_iters: 100000
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_iters: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 100
  log_interval: 10
  save_interval: 2000
  dtype: bfloat16
  seed: 1337
  compile: false
  num_workers: 2
  keep_last_k: 3
